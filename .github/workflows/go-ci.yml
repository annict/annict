name: Go CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

env:
  GO_VERSION: "1.26.2"
  NODE_VERSION: "22.20.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # ここから2つは作業ツリーを書き換えない検査で、ツリーを書き換えるステップより
      # 前に置く必要がある。後続のmake templ-generateはgoimports -w .でGoファイルの
      # ツリー全体を整形するため、あとに置くとimportのドリフトが先に修復されて
      # 検査が空振りする。
      - name: sqlc生成コードの同期をチェック
        run: |
          make sqlc-diff

      - name: Check goimports
        run: |
          make goimports-check

      - name: Check templ generate
        run: |
          make templ-generate
          git diff --exit-code internal/templates/

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          working-directory: go
          args: --config=.golangci.yml ./...

      # koryluslintのcommentサブコマンドで、コメント・文字列・日本語を含む行が
      # korylus-lang.md §3の日本語テキストスタイルに従っているかを検査する。
      # ツリー全体を走査するため、差分のためのベースブランチの取得 (fetch-depth: 0) は要らない。
      - name: 日本語テキストスタイルをチェック
        run: make lint-style

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/annict_test?sslmode=disable
      ANNICT_REDIS_URL: redis://localhost:16379/1
      ANNICT_PORT: "4004"
      ANNICT_DOMAIN: "test.example.com"
      ANNICT_COOKIE_DOMAIN: ".test.example.com"
      ANNICT_SESSION_SECURE: "false"
      ANNICT_SESSION_HTTPONLY: "true"
      ANNICT_S3_BUCKET_NAME: "annict-test"
      ANNICT_IMGPROXY_ENDPOINT: "http://localhost:8080"
      ANNICT_IMGPROXY_KEY: "test_key"
      ANNICT_IMGPROXY_SALT: "test_salt"
      ANNICT_RAILS_APP_URL: "http://localhost:3000"
      ANNICT_DISABLE_RATE_LIMIT: "false"
      ANNICT_RESEND_FROM_EMAIL: "test@example.com"

    services:
      postgresql:
        image: postgres:17.5
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: annict_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.2.3-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get dependencies
        run: |
          go mod download

      - name: Setup test database
        run: |
          make db-setup-test

      - name: Run tests
        env:
          CI: true
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: |
          make build

      - name: Check binary exists
        run: |
          if [ ! -f bin/annict ]; then
            echo "Build failed: binary not found"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: go/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: make test-js

      - name: Type-check frontend
        run: make typecheck-js
