name: Formatter

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/*.md"
      - "**/*.html"
      - "**/*.graphql"
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/*.md"
      - "**/*.html"
      - "**/*.graphql"

env:
  GO_VERSION: "1.26.2"

jobs:
  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm fmt:check

  # koryluslintの `md` サブコマンドでMarkdownの句点改行を検査する。
  # koryluslintはgo/go.modのtoolディレクティブで固定し、公開モジュール
  # github.com/korylus/toolsから取得する。
  #
  # 検査はPRのベースとの差分行 (`-base`) に限定するため、触っていない既存Markdownは
  # 指摘されない。したがってpull request時のみ実行し、fetch-depth: 0で差分に必要な
  # ベースブランチを取得する。
  prose:
    name: Markdown prose
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # ルートMakefileのlint-md-baseターゲット経由でmdを実行し、固定版
      # koryluslintをビルドしてリポジトリルートのMarkdownをPRのベースとの差分で
      # 走査する。mdがgo toolではなくビルド済みバイナリを要する理由はルートMakefileを参照。
      - name: Run koryluslint md (changed lines)
        run: make lint-md-base BASE=origin/${{ github.base_ref }}
