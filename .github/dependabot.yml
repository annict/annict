# Dependabotのバージョン更新を使うには、更新対象のパッケージエコシステムと
# パッケージマニフェストの場所を指定する必要がある。
# 設定オプションの一覧はドキュメントを参照。
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Go版の依存パッケージ
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "daily"
    # グループPRではメジャー更新を意図的に除外している。
    # メジャー更新は破壊的変更を含むことがあり個別PRでレビューしたいため、
    # 以下のすべてのグループでupdate-typesをpatch / minorのみに絞っている
    groups:
      aws-sdk-go-v2:
        patterns:
          - "github.com/aws/aws-sdk-go-v2"
          - "github.com/aws/aws-sdk-go-v2/*"
          - "github.com/aws/smithy-go"
        update-types:
          - "patch"
          - "minor"
      golang-x:
        patterns:
          - "golang.org/x/*"
        update-types:
          - "patch"
          - "minor"
      jackc-pgx:
        patterns:
          - "github.com/jackc/*"
        update-types:
          - "patch"
          - "minor"
      river:
        patterns:
          - "github.com/riverqueue/*"
        update-types:
          - "patch"
          - "minor"
      sentry:
        patterns:
          - "github.com/getsentry/sentry-go"
          - "github.com/getsentry/sentry-go/*"
        update-types:
          - "patch"
          - "minor"

  # Go版のnpm依存パッケージ (pnpm)
  - package-ecosystem: "npm"
    directory: "/go"
    schedule:
      interval: "daily"
    # グループPRではメジャー更新を意図的に除外している。
    # メジャー更新は破壊的変更を含むことがあり個別PRでレビューしたいため、
    # 以下のすべてのグループでupdate-typesをpatch / minorのみに絞っている
    groups:
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "patch"
          - "minor"

  # Rails版のbundler依存パッケージ
  - package-ecosystem: "bundler"
    directory: "/rails"
    schedule:
      interval: "daily"
    # Rails版はメンテナンスモードに入っており、Dependabot alertsに基づく
    # セキュリティアップデートのみ対応する。通常のversion update PRは作らない
    open-pull-requests-limit: 0

  # Rails版のnpm依存パッケージ
  - package-ecosystem: "npm"
    directory: "/rails"
    schedule:
      interval: "daily"
    # Rails版はメンテナンスモードに入っており、Dependabot alertsに基づく
    # セキュリティアップデートのみ対応する。通常のversion update PRは作らない
    open-pull-requests-limit: 0

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
